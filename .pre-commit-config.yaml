# A small Python script set (src/*.py) with a JSON config and a generated
# report. There is no project file, so ruff comes from ruff-pre-commit at a
# pinned rev rather than `uv run` (which would need one).
# One-time setup per clone:  pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      # Check-only: `ruff format` would rewrite five of these files, so
      # formatting is a deliberate cleanup, not a commit gate yet.
      - id: ruff-check
        types: [python]

  # The hook builds gitleaks with the Go toolchain on first run, so Go must be
  # on PATH; the built binary is cached afterwards. Only the staged diff is
  # scanned, and matches are redacted in the output.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
